[package]
name = "storage"
version = "0.1.0"
edition = "2024"

[dependencies]
domain = { path = "../domain" }

chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8.0", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono"] }
thiserror = "2.0.20"
uuid = { version = "1.26.1", features = ["v7", "serde"] }
