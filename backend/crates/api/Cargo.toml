[package]
name = "api"
version = "0.1.0"
edition = "2024"

[dependencies]
domain = { path = "../domain" }

aws-config = "1.12.0"
aws-sdk-s3 = "1.148.0"
axum = "0.8.9"
better-auth = "0.10.0"
jsonwebtoken = "11.1.0"
moka = { version = "0.12.16", features = ["future"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.8.0", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["trace", "compression-full", "timeout", "limit", "cors"] }
tower_governor = "0.8.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
utoipa = { version = "5.5.0", features = ["axum_extras"] }
uuid = { version = "1.26.1", features = ["v7", "serde"] }
validator = { version = "0.21.0", features = ["derive"] }
dotenvy = "0.15.7"
utoipa-axum = "0.2"
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
